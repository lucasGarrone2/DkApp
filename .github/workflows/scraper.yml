name: Copenhagen Rental Scraper Cron

on:
  schedule:
    # Runs every hour at minute 0 (0 * * * *)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies for Puppeteer Headless Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpangocairo-1.0-0 \
            libgtk-3-0

      - name: Install Node Dependencies & Puppeteer Browsers
        run: |
          cd scraper
          npm ci
          npx puppeteer install

      - name: Run Scraper Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KVIKBOLIG_EMAIL: ${{ secrets.KVIKBOLIG_EMAIL }}
          KVIKBOLIG_PASSWORD: ${{ secrets.KVIKBOLIG_PASSWORD }}
        run: |
          cd scraper
          npm run scrape
